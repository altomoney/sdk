name: Release

# Versions packages from pending changesets and stages them on npm with
# trusted publishing. A maintainer then approves each staged version on
# npmjs.com with 2FA before it goes live.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # push the version commit
  id-token: write # authenticate to npm with trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Staged publishing needs npm 11.15.0 or newer. Node 22 ships npm 10.
      - name: Install npm
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate workspace
        run: bun run validate

      - name: Version packages
        id: version
        run: |
          bun run version-packages

          if git diff --quiet; then
            echo "No unreleased changesets."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset package.json packages bun.lock
          git commit -m "chore: version packages [skip ci] [skip release]"
          git pull --rebase origin main
          git push

          echo "versioned=true" >> "$GITHUB_OUTPUT"

      # Runs after a new version commit, or on workflow_dispatch to retry
      # staging a version that is not on npm yet.
      - name: Stage packages for approval
        if: steps.version.outputs.versioned == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for dir in packages/*; do
            manifest="$dir/package.json"
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")

            if jq -e .private "$manifest" > /dev/null; then
              continue
            fi

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm."
              continue
            fi

            npm stage publish "./$dir"
            echo "Staged \`$name@$version\`. Approve it on npmjs.com in the Staged Packages tab, or with \`npm stage approve <stage-id>\`." >> "$GITHUB_STEP_SUMMARY"
          done
